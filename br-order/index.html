<style>
*{box-sizing:border-box}
html,body{margin:0;background:#101014}
.page{max-width:750px;margin:0 auto;overflow:hidden}
.sec{position:relative;width:100%}
.base{display:block;width:100%;height:100%}
.ill,.fx{position:absolute;pointer-events:none}
.ill img{display:block;width:100%;height:auto}
.fx{background-repeat:no-repeat;overflow:hidden;transform-origin:50% 50%}
.ill.float img{animation:float 3.8s ease-in-out var(--d) infinite}
.ill.swing img{transform-origin:20% 80%;animation:swing 3.2s ease-in-out infinite}
.fx.pulse{animation:pulse 2.2s ease-in-out calc(var(--i)*-.37s) infinite}
.fx.wiggle{animation:wiggle 2.6s ease-in-out calc(var(--i)*-.45s) infinite}
.fx.flag{transform-origin:30% 95%}
.fx.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.75) 47%,rgba(255,255,255,.9) 50%,rgba(255,255,255,.75) 53%,transparent 70%);background-size:250% 100%;background-position:150% 0;animation:shine 3.4s ease-in-out calc(var(--i)*-.6s) infinite}
.fx.shine.soft::after{mix-blend-mode:overlay}
.fx.beat{opacity:1}
.fx.beat.run{animation:beat .7s cubic-bezier(.34,1.56,.64,1) calc(var(--i)*.12s) 1 both}
.sec:not(.run) .ill img,.sec:not(.run) .fx,.sec:not(.run) .fx::after{animation-play-state:paused}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3%)}}
@keyframes swing{0%,100%{transform:rotate(0)}50%{transform:rotate(-5deg) scale(1.04)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes wiggle{0%,100%{transform:scale(1.08) rotate(0)}25%{transform:scale(1.08) rotate(-5deg)}75%{transform:scale(1.08) rotate(5deg)}}
@keyframes shine{0%,40%{background-position:150% 0}100%{background-position:-50% 0}}
@keyframes beat{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.ill img,.fx,.fx::after{animation:none!important}}
</style>

<script>
(function(){
  if(!('IntersectionObserver' in window)){document.querySelectorAll('.sec,.fx.beat').forEach(function(e){e.classList.add('run')});return;}
  var io=new IntersectionObserver(function(es){es.forEach(function(e){e.target.classList.toggle('run',e.isIntersecting)})},{threshold:0});
  document.querySelectorAll('.sec').forEach(function(s){io.observe(s)});
  var bo=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('run');bo.unobserve(e.target)}})},{threshold:.6});
  document.querySelectorAll('.fx.beat').forEach(function(b){bo.observe(b)});
})();
</script>
