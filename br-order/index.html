<style>
:root{--page:#101014}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page)}
.page{max-width:750px;margin:0 auto;overflow:hidden}
.sec{position:relative}
.band{width:100%;background-size:100% auto;background-repeat:no-repeat;opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.band.in{opacity:1;transform:none}
.layer{position:absolute;pointer-events:none;opacity:0;transition:opacity .6s ease var(--d),transform .9s cubic-bezier(.34,1.56,.64,1) var(--d)}
.layer img{display:block;width:100%;height:auto}
.layer.pop{transform:translateY(30px) scale(.82)}
.layer.swing{transform:translateX(-40px) rotate(-8deg)}
.layer.photo{transform:scale(1.08);transition-duration:.9s,1.2s;transition-timing-function:ease,ease}
.layer.in{opacity:1;transform:none}
.layer.pop.in img{animation:float 3.6s ease-in-out calc(var(--d) + 1s) infinite}
.layer.swing.in img{animation:wiggle 4s ease-in-out 1.2s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) scale(1.03)}}
@media (prefers-reduced-motion:reduce){.band,.layer{opacity:1!important;transform:none!important;transition:none!important}.layer img{animation:none!important}}
</style>

<script>
(function(){
  var els=document.querySelectorAll('.band,.layer');
  if(!('IntersectionObserver' in window)){els.forEach(function(e){e.classList.add('in')});return;}
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target);}});
  },{rootMargin:'0px 0px -6% 0px',threshold:0.05});
  els.forEach(function(e){io.observe(e)});
  function atEnd(){if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-40){els.forEach(function(e){e.classList.add('in')});window.removeEventListener('scroll',atEnd);}}
  window.addEventListener('scroll',atEnd,{passive:true});atEnd();
})();
</script>
